<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon mirrors the VIE mark: violet rounded tile, white play triangle body,
         coral signal dot past the apex. The coral dot is the brand signature and
         must survive the 16px render — any smaller and it fuses into the triangle,
         which is still distinctive but loses its narrative punch. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><path d='M9 7 L22.5 16 L9 25 Z' fill='white'/><circle cx='27' cy='16' r='2.6' fill='%23ff7a6b'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Insight Engine</title>
    <meta name="description" content="Transform YouTube videos into structured knowledge — summaries, explanations, and personal collections." />
    <meta property="og:title" content="Video Insight Engine" />
    <meta property="og:description" content="Transform YouTube videos into structured knowledge." />
    <meta property="og:type" content="website" />
    <!-- Fonts (Hanken Grotesk, Bricolage Grotesque, JetBrains Mono) are
         self-hosted via @fontsource and imported in src/main.tsx.
         Body face sits outside the AI-trained-default reflex set
         (Inter, DM Sans, Plus Jakarta, Outfit etc.) — self-hosting prevents
         region-based CDN failures from silently reverting to system-ui. -->
    <!-- Critical CSS - minimal styles for loading overlay only -->
    <style>
      *,::before,::after{box-sizing:border-box;border-style:solid}
      html,body{margin:0;padding:0;width:100%;height:100%}
      body{font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;line-height:1.5}
      #root{width:100%;min-height:100vh}
      /* Loading overlay only - Tailwind handles all other colors */
      .loading-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background-color:#fafafa;z-index:9999}
      .loading-spinner{width:2rem;height:2rem;border:3px solid #e5e5e5;border-top-color:#dc2626;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      [data-theme="dark"] .loading-overlay{background-color:#1a1a1a}
      [data-theme="dark"] .loading-spinner{border-color:#404040;border-top-color:#ef4444}
      [data-theme="lagoon"] .loading-overlay{background-color:oklch(21% 0.045 200)}
      [data-theme="lagoon"] .loading-spinner{border-color:oklch(33% 0.04 199);border-top-color:oklch(70% 0.17 35)}
    </style>
    <!-- Preconnect to YouTube domains for faster video loading -->
    <link rel="preconnect" href="https://www.youtube.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
  </head>
  <body>
    <!-- Instant theme application to prevent flash -->
    <!-- SYNC: theme logic must match src/components/theme-provider.tsx resolveTheme() -->
    <script>
      (function() {
        var theme = localStorage.getItem('vie-theme');
        if (theme === 'light') {
          document.documentElement.dataset.theme = 'light';
        } else if (theme === 'lagoon') {
          document.documentElement.dataset.theme = 'lagoon';
        } else if (theme === 'system' || !theme) {
          // System mode or no preference: check OS preference
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
          } else {
            document.documentElement.dataset.theme = 'light';
          }
        } else {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <div class="loading-overlay" id="loading-overlay"><div class="loading-spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
