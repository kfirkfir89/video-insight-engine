name: CI

on:
  push:
    branches: [main, "dev-*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/vie-test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-min-32-chars
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build workspace packages
        run: pnpm --filter @vie/types --filter @vie/shared build
        working-directory: .

      # Cache the mongodb-memory-server binary across runs so the global setup
      # downloads it once per cache lifetime instead of on every CI run.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.24-${{ runner.os }}

      - run: pnpm test

  web:
    name: Web Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build workspace packages
        run: pnpm --filter @vie/types --filter @vie/shared build
        working-directory: .

      - run: pnpm test

  summarizer:
    name: Summarizer Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/summarizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/summarizer/requirements.txt

      - run: pip install -r requirements.txt

      - name: Install llm-common package
        run: pip install -e ../../packages/llm-common

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - run: pytest

  assistant:
    name: Assistant Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/assistant/requirements.txt

      - run: pip install -r requirements.txt

      - name: Install llm-common package
        run: pip install -e ../../packages/llm-common

      - run: python -m pytest
