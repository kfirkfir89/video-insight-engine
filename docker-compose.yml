# ============================================
# Video Insight Engine - Development
# ============================================
services:
  # ----------------------------------------
  # Infrastructure
  # ----------------------------------------

  vie-mongodb:
    image: mongo:7
    container_name: vie-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - vie_mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: video-insight-engine
    networks:
      - vie-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vie-qdrant:
    image: qdrant/qdrant:latest
    container_name: vie-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - vie_qdrant_data:/qdrant/storage
    networks:
      - vie-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vie-redis:
    image: redis:7-alpine
    container_name: vie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vie_redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - vie-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------
  # Application Services
  # ----------------------------------------

  vie-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: vie-api:latest
    container_name: vie-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/app/src:ro
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://vie-mongodb:27017/video-insight-engine
      SUMMARIZER_URL: http://vie-summarizer:8000
      ASSISTANT_URL: http://vie-assistant:8001
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vie-summarizer:
    build:
      context: .
      dockerfile: services/summarizer/Dockerfile
    image: vie-summarizer:latest
    container_name: vie-summarizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./services/summarizer/src:/app/src:ro
      - ./services/summarizer/scripts:/app/scripts:ro
      - ./packages/shared/src/config/domains.json:/app/shared/domains.json:ro
    environment:
      PYTHONUNBUFFERED: 1
      MONGODB_URI: mongodb://vie-mongodb:27017/video-insight-engine
      # Multi-provider LLM configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_FAST_PROVIDER: ${LLM_FAST_PROVIDER:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_FAST_MAX_TOKENS: ${LLM_FAST_MAX_TOKENS:-2048}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60.0}
      LLM_NUM_RETRIES: ${LLM_NUM_RETRIES:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}
      WEBSHARE_PROXY_USERNAME: ${WEBSHARE_PROXY_USERNAME:-}
      WEBSHARE_PROXY_PASSWORD: ${WEBSHARE_PROXY_PASSWORD:-}
      # S3 Media Storage
      S3_BUCKET: ${S3_BUCKET:-vie-transcripts}
      S3_PRESIGNED_URL_EXPIRY: ${S3_PRESIGNED_URL_EXPIRY:-3600}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Custom S3 endpoint (LocalStack for offline development)
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      # Frame extraction (visual blocks)
      FRAME_EXTRACTION_ENABLED: ${FRAME_EXTRACTION_ENABLED:-true}
      # Qdrant vector DB
      QDRANT_HOST: vie-qdrant
      QDRANT_PORT: 6333
      # Redis response cache
      REDIS_URL: redis://vie-redis:6379
      # Advanced transcript cleaning
      TRANSCRIPT_CLEANING_ENABLED: ${TRANSCRIPT_CLEANING_ENABLED:-true}
      # Scene-based frame extraction (additive to timestamp extraction)
      SCENE_EXTRACTION_ENABLED: ${SCENE_EXTRACTION_ENABLED:-true}
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vie-assistant:
    build:
      context: .
      dockerfile: services/assistant/Dockerfile
    image: vie-assistant:latest
    container_name: vie-assistant
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./services/assistant/src:/app/src:ro
    environment:
      PYTHONUNBUFFERED: 1
      ASSISTANT_PORT: 8001
      MONGODB_URI: mongodb://vie-mongodb:27017/video-insight-engine
      QDRANT_URL: http://vie-qdrant:6333
      QDRANT_COLLECTION: transcript_chunks
      # Multi-provider LLM configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_FAST_PROVIDER: ${LLM_FAST_PROVIDER:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60.0}
      LLM_NUM_RETRIES: ${LLM_NUM_RETRIES:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}
      MAX_CONTEXT_CHUNKS: 8
      MAX_CONVERSATION_TURNS: 20
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
      vie-qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vie-admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    image: vie-admin:latest
    container_name: vie-admin
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./services/admin/src:/app/src:ro
    environment:
      PYTHONUNBUFFERED: 1
      MONGODB_URI: mongodb://vie-mongodb:27017/video-insight-engine
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      VIE_API_URL: http://vie-api:3000
      VIE_SUMMARIZER_URL: http://vie-summarizer:8000
      VIE_ASSISTANT_URL: http://vie-assistant:8001
      ALERT_COST_THRESHOLD_USD: ${ALERT_COST_THRESHOLD_USD:-0.50}
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy

  vie-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    image: vie-web:latest
    container_name: vie-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_WS_URL: ws://localhost:3000/ws
    networks:
      - vie-network
    depends_on:
      - vie-api

# ----------------------------------------
# Networks
# ----------------------------------------

networks:
  vie-network:
    driver: bridge
    name: vie-network

# ----------------------------------------
# Volumes
# ----------------------------------------

volumes:
  vie_mongodb_data:
    name: vie_mongodb_data
  vie_qdrant_data:
    name: vie_qdrant_data
  vie_redis_data:
    name: vie_redis_data
